name: MathPractice
options:
  bundleIdPrefix: com.family.mathpractice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: Y5CW757KL2
    CODE_SIGN_STYLE: Automatic
targets:
  MathPractice:
    type: application
    platform: iOS
    sources:
      - path: MathPractice
        excludes:
          - Resources/katex
      - path: MathPractice/Resources/katex
        type: folder
        buildPhase: resources
    info:
      path: MathPractice/Info.plist
      properties:
        CFBundleDisplayName: Maya Math
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan textbook pages to create a practice chapter.
        NSPhotoLibraryUsageDescription: Import photos of textbook pages.
        NSMicrophoneUsageDescription: So you can talk with the math tutor about a question.
        NSSpeechRecognitionUsageDescription: So the tutor can understand what you say. Speech is recognized on this iPad when possible.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.family.mathpractice.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
  MathPracticeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MathPracticeTests
    dependencies:
      - target: MathPractice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MathPracticeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MathPracticeUITests
    dependencies:
      - target: MathPractice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MathPractice
